name = "vayroai"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
APP_NAME = "VayroAI"

[[d1_databases]]
binding = "DB"
database_name = "vayroai-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[ai]
binding = "AI"

[triggers]
crons = ["0 * * * *"]
