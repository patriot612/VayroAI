# Cloudflare Workers configuration.
# 1) Run `npx wrangler d1 create tg-ai-assistant` and paste the printed database_id below.
# 2) Secrets are NEVER stored here — see README (wrangler secret put ...).

name = "tg-ai-assistant"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Optional: hourly cleanup of expired chat messages / temporary data.
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tg-ai-assistant"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Optional free provider: Cloudflare Workers AI (10,000 free "neurons"/day on the Free plan, no API key).
# Remove this block if you do not want it; the models are then hidden automatically.
[ai]
binding = "AI"

[vars]
# Non-secret settings. Everything else lives in the D1 `settings` table (editable by /setting).
DEFAULT_LANGUAGE = "ru"
SUPPORT_CONTACT = ""
PAYMENT_PROVIDER = "none"

[observability]
enabled = true
